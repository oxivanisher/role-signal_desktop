---
- name: Signal desktop only supports amd64
  when: ansible_facts.architecture == "x86_64"
  block:
    - name: Ensure python3-debian is installed
      ansible.builtin.package:
        name: python3-debian
        state: present
      become: true

    - name: Download Signal GPG key
      ansible.builtin.get_url:
        url: https://updates.signal.org/desktop/apt/keys.asc
        dest: /etc/apt/keyrings/signal-desktop.asc
        mode: '0644'
      become: true

    - name: Add Signal apt repository
      ansible.builtin.deb822_repository:
        name: signal-desktop
        types: [deb]
        uris: "https://updates.signal.org/desktop/apt"
        architectures: [amd64]
        components: [main]
        suites: [xenial] # "{{ ansible_facts.distribution_release|lower }}" Signal only supports xenial ... but it seems to work everywhere :shrug:
        signed_by: /etc/apt/keyrings/signal-desktop.asc
        state: present
        enabled: true
      become: true

    - name: Install Signal Desktop
      ansible.builtin.apt:
        name: signal-desktop
        update_cache: true
        state: present
      ignore_errors: "{{ ansible_check_mode }}"
      become: true
